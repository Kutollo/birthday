<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Luyanda 💗</title>

<style>

body{
margin:0;
font-family:"Poppins",sans-serif;
background:linear-gradient(135deg,#ffd6e7,#ffeef5);
overflow-x:hidden;
color:#444;
}

/* floating hearts */

.heart{
position:fixed;
color:#ff6b9a;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
from{transform:translateY(100vh);opacity:0}
to{transform:translateY(-10vh);opacity:1}
}

/* container */

.container{
max-width:700px;
margin:auto;
padding:60px 20px;
text-align:center;
}

h1{
color:#ff4f87;
font-size:32px;
margin-bottom:20px;
}

/* typing */

#typing{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.1);
line-height:1.7;
min-height:220px;
white-space:pre-line;
}

/* gift box */

.gift{
margin-top:30px;
padding:20px;
background:white;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.1);
}

video{
width:100%;
margin-top:25px;
border-radius:15px;
}

</style>
</head>

<body>

<div class="container">

<h1>Happy Birthday Luyanda 🎉</h1>

<div id="typing"></div>

<div class="gift">
💝 Your gift: a **silver plated bangle watch**  
<br><br>
A small reminder that some connections don’t disappear —  
they just pause and continue in different ways.
</div>

<video controls>
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<script>

const message=`Happy birthday.

Today feels important, because it’s the day someone really special came into the world. I hope you’re surrounded by love, laughter, and everything that makes your heart feel light today.

I’ve always had a soft spot for you… even with time and distance, that never really changed. And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before. I don’t want to dwell on it today, but I do regret how I handled things, and I’m grateful we found our way back to talking again.

I got you a small gift — a silver plated bangle watch. I chose it because it represents time… and how some things don’t really disappear, they just pause and continue in different ways.

I hope you wear it often. Not just as something pretty, but as a reminder that you are valued, remembered, and genuinely appreciated.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable in the best way.

Enjoy your day.`

let i=0;

function typeWriter(){

if(i<message.length){

document.getElementById("typing").innerHTML+=message.charAt(i);

i++;

setTimeout(typeWriter,35);

}

}

typeWriter();

/* floating hearts */

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

},400);

/* voice narration */

function speak(){

let speech=new SpeechSynthesisUtterance(message);

speech.rate=0.9;

speech.pitch=1;

window.speechSynthesis.speak(speech);

}

window.onload=speak;

</script>

</body>
</html>
