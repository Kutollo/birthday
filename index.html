<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.55);
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:-1;
}

/* SECTIONS */
section{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:60px 20px;
text-align:center;
opacity:0;
transform:translateY(40px);
transition:1.2s ease;
}

section.show{
opacity:1;
transform:translateY(0);
}

/* CARD */
.card{
max-width:850px;
width:100%;
padding:45px;
border-radius:25px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,0.12);
box-shadow:0 20px 70px rgba(0,0,0,0.6);
}

/* TITLE */
h1{
font-family:'Dancing Script';
font-size:52px;
margin-bottom:20px;
}

/* TEXT */
p{
font-size:18px;
line-height:1.9;
white-space:pre-line;
min-height:50px;
}

/* MEDIA */
img,video{
width:100%;
border-radius:18px;
margin-top:20px;
display:none;
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- SECTION 1 -->
<section id="s1" class="show">
<div class="card">
<h1 id="title1"></h1>
<p id="text1"></p>
</div>
</section>

<!-- SECTION 2 -->
<section id="s2">
<div class="card">
<h1 id="title2"></h1>
<p id="text2"></p>
<img id="img1" src="IMG_2034.jpeg">
</div>
</section>

<!-- SECTION 3 -->
<section id="s3">
<div class="card">
<h1 id="title3"></h1>
<video id="vid1" autoplay muted loop playsinline>
<source src="luyanda.mp4" type="video/mp4">
</video>
</div>
</section>

<!-- SECTION 4 -->
<section id="s4">
<div class="card">
<h1 id="title4"></h1>
<p id="text4"></p>
</div>
</section>

<script>

/* =========================
TYPEWRITER (100ms)
========================= */
function type(el, text, speed=100, callback){
el.innerHTML = "";
let i = 0;

function run(){
if(i < text.length){
el.innerHTML += text.charAt(i);
i++;
setTimeout(run, speed);
} else if(callback){
callback();
}
}
run();
}

/* =========================
FULL STORY FLOW (ORDERED)
========================= */

function start(){

// 1 TITLE + INTRO
type(document.getElementById("title1"),
"For Luyanda 💗", 100, ()=>{

type(document.getElementById("text1"),
`Specially made with love for you Luyanda

I decided to be the first one to celebrate you before anyone else hence you seeing it today`, 100, ()=>{

document.getElementById("s2").classList.add("show");

// 2 BIRTHDAY MESSAGE
type(document.getElementById("title2"),
"Happy Birthday 🩵", 100, ()=>{

type(document.getElementById("text2"),
`Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you as much as you have one for me… even with time and distance, that never really changed.

And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before.

I don’t want to dwell on it today, but I do regret how I handled things, and I’m grateful you gave me another chance to be in your life again and we found our way back to talking again. I know I'm the last person to be talking about promises but I promise to never fumble the chance you gave us. Hurting you again is something I don't wanna see it happening.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable in the best way.

Enjoy your day. I Love You🩵`, 100, ()=>{

document.getElementById("img1").style.display = "block";
setTimeout(()=>{

document.getElementById("s3").classList.add("show");

// 3 VIDEO SECTION
type(document.getElementById("title3"),
"It's Your Turn Ke Mfazi", 100, ()=>{

document.getElementById("vid1").style.display = "block";

setTimeout(()=>{

document.getElementById("s4").classList.add("show");

// 4 GIFT
type(document.getElementById("title4"),
"Your Gift ⌚", 100, ()=>{

type(document.getElementById("text4"),
`I got you a small gift

I chose it because it represents time… and how some things don’t really disappear, they just pause and continue in different ways.

Every moment is something I wanted you to feel held in, even when I’m not there. Not rushed, not forgotten, not replaced… just gently remembered in the way that stays.

I hope it will never leave your wrist, just like how you never really left my heart 🥹

Now… close your eyes for me. Just for a moment.`, 100);

});

},1500);

});

},800);

});

});

});

});

}

window.onload = start;

</script>

</body>
</html>
