<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* LANDING */
#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

#landing h1{
font-family:'Dancing Script';
font-size:60px;
margin-bottom:20px;
}

#landing p{
font-size:20px;
opacity:0.85;
min-height:80px;
}

/* BUTTON */
button{
margin-top:30px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

/* MAIN */
#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* GLASS */
.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(22px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 50px rgba(0,0,0,0.5);

opacity:0;
transform:translateY(30px);
transition:1s;
}

.glass.show{
opacity:1;
transform:translateY(0);
}

/* TITLE */
.title{
font-family:'Dancing Script';
font-size:55px;
text-align:center;
margin-bottom:25px;
}

/* MESSAGE */
.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:250px;
}

/* MEDIA */
.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;
display:none;
}

/* GIFT BUTTON */
.gift-btn{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:rgba(255,255,255,0.15);
color:white;
cursor:pointer;
display:none;
}

/* HEARTS */
.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- MUSIC -->
<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass" id="sec1">

<h1 class="title" id="t1"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="sec2">

<h1 class="title" id="t2"></h1>

<video autoplay muted loop playsinline class="video" id="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="sec3">

<h1 class="title" id="t3"></h1>

<button class="gift-btn" id="giftBtn" onclick="revealGift()">
Reveal Gift Message
</button>

<p class="message" id="gift"></p>

</div>

</section>

<script>

/* TYPE FUNCTION */
function typeText(el, text, speed, callback){
let i = 0;
el.innerHTML = "";

function run(){
if(i < text.length){
el.innerHTML += text.charAt(i);
i++;
setTimeout(run, speed);
} else if(callback){
callback();
}
}
run();
}

/* LANDING */
const landingTitle = "For Luyanda 💗";
const landingText = `Made with love…

just for you.`;

typeText(document.getElementById("landingTitle"), landingTitle, 100, ()=>{
typeText(document.getElementById("landingText"), landingText, 80);
});

/* ENTER SITE (FIXED) */
function enterSite(){

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

startStory();
}

/* STORY FLOW */
function startStory(){

const t1 = "Happy Birthday 🩵 Luyanda 🎈";

const msg = `Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you… even with time and distance, that never really changed.

And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before.

I don’t want to dwell on it today, but I do regret how I handled things.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable.

I Love You 🩵`;

typeText(document.getElementById("t1"), t1, 100, ()=>{

typeText(document.getElementById("message"), msg, 100, ()=>{

document.getElementById("photo").style.display="block";

/* VIDEO */
setTimeout(()=>{
document.getElementById("sec2").classList.add("show");

typeText(document.getElementById("t2"), "It's Your Turn", 100, ()=>{

document.getElementById("video").style.display="block";

/* GIFT SECTION */
setTimeout(()=>{
document.getElementById("sec3").classList.add("show");

typeText(document.getElementById("t3"), "Your Gift", 100, ()=>{
document.getElementById("giftBtn").style.display="inline-block";
});

},2000);

});

},1500);

});

});
}

/* GIFT */
const giftText = `I got you a small gift

I chose it because it represents time… and how some things don’t really disappear, they just pause and continue in different ways.

Every moment is something I wanted you to feel held in.

I hope you wear it often…

Now… close your eyes for me. Just for a moment.`;

function revealGift(){

const g = document.getElementById("gift");
g.innerHTML = "";
document.getElementById("giftBtn").style.display="none";

typeText(g, giftText, 60);
}

/* HEARTS */
setInterval(()=>{

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(heart);
setTimeout(()=>heart.remove(),9000);

},500);

</script>

</body>
</html>
