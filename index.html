<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Luyanda ❤️</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
text-align:center;
}

button{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}

#text{
margin-top:30px;
font-size:20px;
max-width:600px;
white-space:pre-line;
}
</style>

</head>

<body>

<button onclick="start()">Open</button>

<div id="text"></div>

<script>

const message = `I made this for you…

because you matter more than I can explain.

Happy Birthday Luyanda ❤️`;

function typeText(text, el, speed=100){
let i=0;
el.innerHTML="";

function loop(){
if(i<text.length){
el.innerHTML += text.charAt(i);
i++;
setTimeout(loop,speed);
}
}

loop();
}

function start(){
typeText(message, document.getElementById("text"));
}

</script>

</body>
</html>
