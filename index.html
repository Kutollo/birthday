<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Luyanda</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
  color: white;
  font-family: Arial;
}

.container {
  text-align: center;
  animation: fadeIn 2s ease-in;
}

h1 {
  font-size: 2em;
  letter-spacing: 2px;
}

p {
  opacity: 0.7;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: white;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(1.1); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
  <h1>Made Specially For You</h1>
  <p>Luyanda • 23 May 2026</p>
  <button onclick="enter()">Open</button>
</div>

<script>
function enter() {
  window.location.href = "main.html";
}
</script>

</body>
</html>
