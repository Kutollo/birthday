<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

/* =======================
BASE
======================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* =======================
BACKGROUND
======================= */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* =======================
OPENING IMAGE (ENHANCED CINEMATIC)
======================= */

#openingImage{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:100000;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

#openingImage img{
width:100%;
height:100%;
object-fit:cover;
transform:scale(1.1);
animation:zoomFade 30s linear forwards;
}

@keyframes zoomFade{
0%{transform:scale(1.1);}
100%{transform:scale(1.25);}
}

/* OVERLAY TEXT (LYRICS STYLE) */
#openingText{
position:absolute;
bottom:10%;
width:100%;
text-align:center;
font-size:18px;
padding:0 20px;
line-height:1.6;
opacity:0;
animation:textFlow 30s linear forwards;
font-family:'Dancing Script';
}

@keyframes textFlow{
0%{opacity:0;}
10%{opacity:1;}
90%{opacity:1;}
100%{opacity:0;}
}

/* =======================
LANDING
======================= */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
gap:14px;
transition:1s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

#landingTitle{
font-family:'Dancing Script';
font-size:42px;
line-height:1.2;
margin:0;
text-align:center;
}

#landingText{
max-width:520px;
line-height:1.6;
font-size:15px;
opacity:0.92;
white-space:pre-line;
margin:0;
text-align:center;
}

/* =======================
MAIN
======================= */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* (rest unchanged for brevity) */
.glass{background:rgba(255,255,255,0.07);backdrop-filter:blur(25px);border-radius:25px;padding:50px;margin-bottom:40px;border:1px solid rgba(255,255,255,0.18);box-shadow:0 10px 60px rgba(0,0,0,0.6);opacity:0;transform:translateY(40px) scale(0.95);filter:blur(10px);transition:1.2s ease;}
.glass.show{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}

.title{font-family:'Dancing Script';font-size:34px;text-align:center;margin-bottom:25px;}

.message{white-space:pre-line;text-align:justify;line-height:1.9;font-size:18px;}

button{margin-top:10px;padding:15px 55px;border-radius:40px;border:none;background:white;color:black;font-size:18px;cursor:pointer;transition:0.4s;font-weight:600;}

button:hover{transform:scale(1.08);}

</style>

</head>

<body>

<!-- OPENING -->
<div id="openingImage">
    <img src="IMG_2186.png">

    <!-- synced cinematic text -->
    <div id="openingText">
        I still choose you…<br><br>
        even in silence…<br><br>
        even in distance…<br><br>
        always you.
    </div>
</div>

<audio id="introSong">
    <source src="love.mp3" type="audio/mp3">
</audio>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->
<section id="main">
<!-- your original content unchanged -->
</section>

<script>

/* =======================
FULL AUTOPLAY FIX (iPhone SAFE)
======================= */

let introUnlocked = false;

function unlockAudio(){
    const introSong = document.getElementById("introSong");
    const music = document.getElementById("music");

    introSong.play().catch(()=>{});
    music.play().catch(()=>{});

    introUnlocked = true;

    document.removeEventListener("touchstart", unlockAudio);
    document.removeEventListener("click", unlockAudio);
}

document.addEventListener("touchstart", unlockAudio);
document.addEventListener("click", unlockAudio);

/* =======================
LOAD
======================= */

window.onload = function(){

document.getElementById("landingTitle").innerText = landingTitle;
document.getElementById("landingText").innerText = landingText;

const introSong = document.getElementById("introSong");

/* start at 3:24 */
introSong.addEventListener("loadedmetadata", () => {
    introSong.currentTime = 204;
});

/* play safely */
introSong.play().catch(()=>{});

setTimeout(()=>{

document.getElementById("openingImage").style.opacity = "0";

introSong.pause();
introSong.currentTime = 0;

setTimeout(()=>{
document.getElementById("openingImage").remove();
},1000);

},30000);

};

</script>

</body>
</html>
