<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND VIDEO */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* dark overlay */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* LANDING */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
transition:1.2s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

/* MAIN */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* GLASS */

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 60px rgba(0,0,0,0.6);

opacity:0;
transform:translateY(40px) scale(0.95);
filter:blur(12px);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

/* TITLES */

.title{
font-family:'Dancing Script';
font-size:30px;
text-align:center;
margin-bottom:25px;
}

/* MESSAGE */

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:250px;
}

/* INTRO CENTERED */

#introLine{
text-align:center;
line-height:1.9;
margin-bottom:25px;
opacity:0.9;
}

/* MEDIA */

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;
opacity:0;
transform:scale(1.05);
filter:blur(10px);
transition:1.2s ease;
}

.photo.show,
.video.show{
opacity:1;
transform:scale(1);
filter:blur(0);
}

/* BUTTON */

button{
margin-top:30px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

/* ROMANTIC POPUP */

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:40px 50px;
border-radius:25px;
text-align:center;
font-size:28px;
font-family:'Dancing Script';
animation:popupFloat 3s ease-in-out infinite;
}

@keyframes popupFloat{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

.popup-hearts{
font-size:22px;
margin-top:10px;
}

/* FLOATING HEARTS */

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

</style>

</head>

<body>

<!-- BACKGROUND VIDEO -->

<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- POPUP -->

<div id="popup">

<div class="popup-box">
Please close your eyes 🙈
<div class="popup-hearts">❤️✨</div>
</div>

</div>

<!-- LANDING -->

<section id="landing">

<h1 id="landingTitle"></h1>

<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->

<section id="main">

<div class="glass" id="section1">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="section2">

<h1 class="title" id="videoTitle"></h1>

<video muted loop playsinline class="video" id="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="section3">

<h1 class="title" id="giftTitle"></h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;"></p>

</div>

</section>

<script>

/* FORCE VIDEO PLAY */

window.addEventListener("load",()=>{

const bg=document.getElementById("bgVideo");

bg.play().catch(()=>{

document.body.addEventListener("click",()=>{
bg.play();
},{once:true});

});

});

/* TYPE FUNCTION */

function typeText(id,text,speed=110,callback){

let i=0;

const el=document.getElementById(id);

el.innerHTML="";

function typing(){

if(i<text.length){

el.innerHTML+=text.charAt(i);

i++;

setTimeout(typing,speed);

}else{

if(callback)callback();

}

}

typing();

}

/* TEXT */

const landingTitle="Made with love, specially for you — Luyanda 💗";

const landingText=`I made something for you…

because you matter more than I ever say out loud.

Take your time… and open it when you’re ready 💗`;

const introLine="I wanted to be the first to celebrate you… before anyone else gets the chance, so you’re seeing this a little earlier.";

const mainTitle="Happy Birthday🩵my Luyanda🎈";

const videoTitle="It's Your Turn Ke Mfazi";

const giftTitle="Your Gift";

/* LANDING */

window.onload=function(){

typeText("landingTitle",landingTitle);

setTimeout(()=>{

typeText("landingText",landingText);

},1000);

};

/* ENTER SITE */

function enterSite(){

document.getElementById("landing").classList.add("hide");

setTimeout(()=>{

document.getElementById("landing").style.display="none";

document.getElementById("main").style.display="block";

const music=document.getElementById("music");

music.volume=0.6;

music.play().catch(()=>{});

startFlow();

},1200);

}

/* FLOW */

function startFlow(){

showSection("section1");

typeText("introLine",introLine,110,()=>{

typeText("mainTitle",mainTitle);

});

}

/* GIFT */

function revealGift(){

const g=document.getElementById("gift");

g.style.display="block";

typeText("gift",giftText,110,()=>{

setTimeout(()=>{

document.getElementById("popup").classList.add("show");

},1200);

});

}

/* SECTION SHOW */

function showSection(id){

document.getElementById(id).classList.add("show");

}

/* HEARTS */

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),9000);

},500);

</script>

</body>

</html>
