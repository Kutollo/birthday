<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

/* =======================
BASE (UNCHANGED)
======================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* =======================
TAP TO BEGIN (NEW ONLY)
======================= */

#tapScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:100000;
text-align:center;
}

#tapScreen h1{
font-family:'Dancing Script';
font-size:42px;
margin-bottom:15px;
}

#tapScreen button{
padding:15px 55px;
border:none;
border-radius:40px;
background:white;
color:black;
font-size:18px;
font-weight:600;
cursor:pointer;
}

/* =======================
OPENING IMAGE (NEW FIX)
======================= */

#openingImage{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:99999;
display:none;
align-items:center;
justify-content:center;
}

#openingImage img{
max-width:100%;
max-height:100%;
width:auto;
height:auto;
object-fit:contain;
transform:scale(0.2);
opacity:0;
animation:zoomIn 1.8s ease forwards;
display:block;
}

.photo,
.video{
display:block;
width:100%;
max-width:100%;
max-height:70vh;
margin:25px auto 0;
object-fit:contain;
border-radius:18px;
}

img, video{
display:block;
}

@keyframes zoomIn{
0%{transform:scale(0.2);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

#openingImage.fadeOut{
transition:1s ease;
opacity:0;
}

/* =======================
YOUR ORIGINAL CSS (UNCHANGED)
======================= */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
gap:14px;
transition:1s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

#landingTitle{
font-family:'Dancing Script';
font-size:42px;
line-height:1.2;
margin:0;
text-align:center;
}

#landingText{
max-width:520px;
line-height:1.6;
font-size:15px;
opacity:0.92;
white-space:pre-line;
margin:0;
text-align:center;
}

#landing button{
margin-top:10px;
padding:14px 50px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:16px;
cursor:pointer;
transition:0.4s;
font-weight:600;
}

#landing button:hover{
transform:scale(1.07);
}

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 60px rgba(0,0,0,0.6);
opacity:0;
transform:translateY(40px) scale(0.95);
filter:blur(10px);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

.title{
font-family:'Dancing Script';
font-size:34px;
text-align:center;
margin-bottom:25px;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
}

button{
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
font-weight:600;
}

</style>

</head>

<body>

<!-- =======================
TAP TO BEGIN (NEW ENTRY)
======================= -->
<div id="tapScreen">
    <h1>Made with love ❤️</h1>
    <button onclick="startExperience()">Tap to Begin</button>
</div>

<!-- OPENING IMAGE -->
<div id="openingImage">
    <img src="IMG_2186.png">
</div>

<!-- AUDIO (UNCHANGED FILE) -->
<audio id="loveSong">
    <source src="love.mp3" type="audio/mp3">
</audio>

<!-- BACKGROUND (UNCHANGED) -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- =======================
YOUR ORIGINAL WEBSITE (UNCHANGED)
======================= -->

<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<section id="main">

<div class="glass" id="section1">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="section2">

<h1 class="title" id="videoTitle"></h1>

<video muted playsinline loop id="video" class="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="section3">

<h1 class="title" id="giftTitle"></h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none; margin-top:25px;"></p>

</div>

</section>

<script>

/* =======================
OPTION 1 ENTRY SYSTEM
======================= */

function startExperience(){

document.getElementById("tapScreen").style.display="none";

const img=document.getElementById("openingImage");
img.style.display="flex";

/* LOVE SONG FIXED */
const song=document.getElementById("loveSong");
song.currentTime=204; // 3:24
song.volume=1;

song.play().catch(()=>{});

/* 30 SECOND INTRO */
setTimeout(()=>{

img.classList.add("fadeOut");

setTimeout(()=>{
img.remove();
},1000);

song.pause();
song.currentTime=0;

},30000);

}

/* =======================
YOUR ORIGINAL CODE (UNCHANGED)
======================= */

const landingTitle = "Made with love… just for you, my Luyanda 💗";

const landingText =
"I made this for you because you deserve to feel loved, appreciated, and special in every possible way. 💗\n\n" +
"I know I wasn’t there for the past two birthdays,\n" +
"but having the chance to celebrate this one with you meant more to me than you probably realize.\n\n" +
"So even after the birthday celebrations are over…\n" +
"I still wanted you to have something you can come back to and smile at whenever you need to. 🩵";

const introLine =
"I wanted this to remain something personal, meaningful, and unforgettable… because celebrating you will always matter to me.";

const mainTitle =
"To My Luyanda 🩵";

const mainText =
"Your birthday may have passed… but the way I feel about you hasn’t changed for a second. 🩵\n\n" +
"I still hope your day was filled with love, laughter, peace, and all the little things that made your heart feel light and happy.\n\n" +
"You deserve happiness that goes beyond just one special day.\n\n" +
"I’ve always had a soft spot for you… just as much as you’ve always had one for me.\n\n" +
"No matter the time, distance, or everything that happened in between, that feeling never truly disappeared.\n\n" +
"Being able to talk to you again is something I genuinely appreciate more than I say out loud.\n\n" +
"And I’ll always be grateful that somehow we found our way back to each other.\n\n" +
"I know I might not be perfect, but one thing I mean with all my heart is this: I never want to hurt you again or take your love for granted.\n\n" +
"I just want you to continue feeling loved, appreciated, protected, and cared for… not only on your birthday, but every day after it too.\n\n" +
"I love you 🩵";

const giftTitle = "Your Gift 🎁";

const giftText =
"I got you something small…\n\n" +
"but it means so much more than it probably looks like. 🥹\n\n" +
"I wanted to give you something you could keep close to you… something simple, but constant.\n\n" +
"Something that quietly becomes part of your everyday life… and maybe reminds you, even in silence, that there’s someone thinking about you.\n\n" +
"Not in a loud or overwhelming way… just something soft, steady, and real.\n\n" +
"And every time you notice it on your wrist, I hope it brings you a little warmth… a quiet reminder that you are cared for, appreciated, valued, and deeply close to someone’s heart.\n\n" +
"It’s honestly just something I felt was right for you.\n\n" +
"I can’t wait to see how beautiful it looks on that cute hand of yours… 🥺\n\n" +
"And I hope it stays with you for a very long time… the same way you’ve stayed close to my heart. 🩵";

window.onload = function(){

document.getElementById("landingTitle").innerText = landingTitle;
document.getElementById("landingText").innerText = landingText;

};

function enterSite(){

document.getElementById("landing").classList.add("hide");

setTimeout(()=>{

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

startFlow();

},1000);

}

function startFlow(){

document.getElementById("section1").classList.add("show");

document.getElementById("introLine").innerText=introLine;
document.getElementById("mainTitle").innerText=mainTitle;
document.getElementById("message").innerText=mainText;

setTimeout(()=>{

document.getElementById("photo").classList.add("show");

setTimeout(()=>{

document.getElementById("section2").classList.add("show");

const vid=document.getElementById("video");
vid.play().catch(()=>{});

setTimeout(()=>{

document.getElementById("section3").classList.add("show");

document.getElementById("giftTitle").innerText=giftTitle;

},2000);

},2000);

},1200);

}

function revealGift(){

const gift=document.getElementById("gift");

gift.style.display="block";
gift.innerText=giftText;

const popup=document.getElementById("popup");

setTimeout(()=>{

popup.classList.add("show");

setTimeout(()=>popup.classList.remove("show"),10000);

},2000);

}

</script>

</body>
</html>
