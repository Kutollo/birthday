<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */

#bgVideo{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* LANDING */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

#landing h1{
font-family:'Dancing Script';
font-size:60px;
min-height:70px;
margin-bottom:20px;
}

#landing p{
font-size:18px;
opacity:0.9;
max-width:600px;
min-height:80px;
}

/* MAIN */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* SCENES */

.glass{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
opacity:1;
transition:1s ease;
}

/* TEXT */

.title{
font-family:'Dancing Script';
font-size:32px;
text-align:center;
margin-bottom:25px;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:200px;
}

/* MEDIA */

.photo,.video{
width:100%;
border-radius:18px;
margin-top:20px;
}

/* BUTTON */

button{
margin-top:25px;
padding:15px 50px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
}

/* POPUP */

#popup{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.85);
opacity:0;
pointer-events:none;
transition:1s;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-card{
background:rgba(255,255,255,0.1);
padding:40px;
border-radius:20px;
font-family:'Dancing Script';
font-size:22px;
text-align:center;
}

</style>

</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- POPUP -->
<div id="popup">
<div class="popup-card">Please close your eyes 🙈💗</div>
</div>

<!-- LANDING (FORCED VISIBLE) -->
<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="start()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo">

</div>

<div class="glass">

<h1 class="title" id="videoTitle"></h1>

<video muted loop playsinline class="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass">

<h1 class="title">Your Gift</h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;"></p>

</div>

</section>

<script>

/* ================= SAFE TYPE ENGINE ================= */

function type(id,text,speed=110){

return new Promise(resolve=>{

const el=document.getElementById(id);
el.innerHTML="";
let i=0;

function run(){

if(i<text.length){
el.innerHTML+=text[i++];
setTimeout(run,speed);
}else resolve();

}

run();

});

}

/* ================= YOUR TEXT (UNCHANGED) ================= */

const landingTitle="Made with love, specially for you — Luyanda 💗";

const landingText=`I made something for you…

because you matter more than I ever say out loud.

Take your time… and open it when you’re ready 💗`;

const introLine="I wanted to be the first to celebrate you… before anyone else gets the chance.";

const mainTitle="Happy Birthday🩵my Luyanda🎈";

const mainText=`Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you as much as you have one for me… even with time and distance, that never really changed.

And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before.

I don’t want to dwell on it today, but I do regret how I handled things.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable.

Enjoy your day. I Love You🩵`;

const videoTitle="It's Your Turn Ke Mfazi";

const giftText=`I got you a small gift

I chose it because it represents time…

I hope you wear it often.

Not just as something pretty, but as a reminder that you are loved 🥹`;

/* ================= SAFE FLOW (NO BREAKS) ================= */

async function start(){

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

/* guaranteed order */

await type("introLine",introLine);
await type("mainTitle",mainTitle);
await type("message",mainText);

document.querySelector(".photo").classList.add("show");

await type("videoTitle",videoTitle);

}

/* ================= GIFT ================= */

function revealGift(){

const g=document.getElementById("gift");
g.style.display="block";

type("gift",giftText).then(()=>{

setTimeout(()=>{
document.getElementById("popup").classList.add("show");
},1000);

});

}

/* ================= LANDING SAFE LOAD ================= */

window.onload=function(){

type("landingTitle",landingTitle);
type("landingText",landingText);

};

</script>

</body>
</html>
