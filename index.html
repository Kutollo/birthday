<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
}

/* BACKGROUND */
#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* MAIN */
.container{
max-width:800px;
width:100%;
}

h1{
font-family:'Dancing Script';
font-size:48px;
margin-bottom:20px;
}

p{
font-size:18px;
line-height:1.8;
white-space:pre-line;
min-height:120px;
}

/* MEDIA */
img,video{
width:100%;
border-radius:18px;
margin-top:20px;
display:none;
}

/* GIFT */
#gift{
margin-top:20px;
display:none;
}

/* TAP HINT */
.tap{
position:fixed;
bottom:30px;
font-size:14px;
opacity:0.6;
animation:fade 2s infinite;
}

@keyframes fade{
0%,100%{opacity:0.3;}
50%{opacity:1;}
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

<h1 id="title">For Luyanda 💗</h1>

<p id="text">Tap anywhere to begin your story…</p>

<img id="img" src="IMG_2034.jpeg">

<video id="vid" autoplay muted loop>
<source src="luyanda.mp4" type="video/mp4">
</video>

<p id="gift"></p>

</div>

<div class="tap">Tap anywhere to continue →</div>

<script>

let step = 0;

function type(el, txt, speed=100, cb){
el.innerHTML = "";
let i = 0;

function run(){
if(i < txt.length){
el.innerHTML += txt[i++];
setTimeout(run, speed);
}else if(cb){
cb();
}
}
run();
}

document.body.addEventListener("click", nextStep);

function nextStep(){

step++;

if(step === 1){

type(document.getElementById("text"),
`Happy Birthday 🩵 Luyanda 🎈

Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you… and that never really changed.

I Love You 🩵`);

}

if(step === 2){

document.getElementById("img").style.display = "block";

type(document.getElementById("text"),
`I wanted to be the first to celebrate you… before anyone else gets the chance.

So I made this just for you 💗`);

}

if(step === 3){

document.getElementById("vid").style.display = "block";

type(document.getElementById("text"),
`A moment of you… because you deserve to be remembered like this.`);

}

if(step === 4){

document.getElementById("gift").style.display = "block";

type(document.getElementById("gift"),
`I got you a small gift…

I chose it because it represents time… and how some things don’t really disappear, they just pause and continue in different ways.

Every moment is something I wanted you to feel held in.

I hope it will never leave your wrist… just like how you never really left my heart 🥹

Now… close your eyes for me. Just for a moment 💗`);
}

if(step > 4){
step = 4;
}

}

</script>

</body>
</html>
