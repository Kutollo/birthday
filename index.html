<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

/* =======================
BASE
======================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* =======================
BACKGROUND
======================= */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* =======================
OPENING IMAGE
======================= */

#openingImage{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:100000;
display:flex;
align-items:center;
justify-content:center;
}

#openingImage img{
width:100%;
height:100%;
object-fit:cover;
}

/* =======================
LANDING
======================= */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
gap:14px;
transition:1s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

#landingTitle{
font-family:'Dancing Script';
font-size:42px;
line-height:1.2;
margin:0;
text-align:center;
}

#landingText{
max-width:520px;
line-height:1.6;
font-size:15px;
opacity:0.92;
white-space:pre-line;
margin:0;
text-align:center;
}

#landing button{
margin-top:10px;
padding:14px 50px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:16px;
cursor:pointer;
transition:0.4s;
font-weight:600;
}

#landing button:hover{
transform:scale(1.07);
}

/* =======================
MAIN
======================= */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 60px rgba(0,0,0,0.6);

opacity:0;
transform:translateY(40px) scale(0.95);
filter:blur(10px);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

.title{
font-family:'Dancing Script';
font-size:34px;
text-align:center;
margin-bottom:25px;
}

#introLine{
text-align:center;
margin-bottom:20px;
line-height:1.9;
opacity:0.9;
white-space:pre-line;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
}

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;

opacity:0;
transform:scale(1.05);
filter:blur(10px);
transition:1.2s ease;
}

.photo.show,
.video.show{
opacity:1;
transform:scale(1);
filter:blur(0);
}

/* =======================
BUTTONS
======================= */

button{
margin-top:10px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
font-weight:600;
}

button:hover{
transform:scale(1.08);
}

/* =======================
POPUP
======================= */

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.88);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:40px 50px;
border-radius:25px;
font-family:'Dancing Script';
font-size:32px;
text-align:center;
line-height:1.5;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

/* =======================
HEARTS
======================= */

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
pointer-events:none;
}

@keyframes floatUp{
0%{transform:translateY(0);opacity:0.4;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* RESPONSIVE */

@media(max-width:768px){

#landingTitle{font-size:34px;}
#landingText{font-size:14px;max-width:95%;}
.glass{padding:35px 25px;}
.title{font-size:30px;}
.message{font-size:16px;}
.popup-box{font-size:26px;padding:30px;}

}

</style>

</head>

<body>

<!-- OPENING IMAGE -->
<div id="openingImage">
    <img src="IMG_2186.png">
</div>

<!-- AUDIO -->
<audio id="introSong">
    <source src="love.mp3" type="audio/mp3">
</audio>

<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- POPUP -->
<div id="popup">
<div class="popup-box">
Please don’t cry again 🥹<br>
you’re gonna ruin your lashes ❤️
</div>
</div>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass" id="section1">

<p id="introLine"></p>
<h1 class="title" id="mainTitle"></h1>
<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="section2">

<h1 class="title" id="videoTitle"></h1>

<video muted playsinline loop id="video" class="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="section3">

<h1 class="title" id="giftTitle"></h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;margin-top:25px;"></p>

</div>

</section>

<script>

/* TEXT */
const landingTitle = "Made with love… just for you, my Luyanda 💗";

const landingText =
"I made this for you because you deserve to feel loved, appreciated, and special in every possible way. 💗\n\n" +
"So even after the birthday celebrations… I still wanted you to have something special. 🩵";

/* LOAD */
window.onload = function(){
document.getElementById("landingTitle").innerText = landingTitle;
document.getElementById("landingText").innerText = landingText;
};

/* ENTER SITE (FIXED AUDIO HERE) */
function enterSite(){

document.getElementById("landing").classList.add("hide");

setTimeout(()=>{

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

/* START INTRO SONG AFTER USER CLICK (IMPORTANT FIX) */
const introSong = document.getElementById("introSong");
const openingImage = document.getElementById("openingImage");

introSong.currentTime = 204; // 3:24

introSong.play().catch(()=>{});

/* REMOVE IMAGE AFTER 30s */
setTimeout(()=>{

openingImage.style.opacity="0";

setTimeout(()=>{
openingImage.remove();
},1000);

introSong.pause();
introSong.currentTime = 0;

},30000);

startFlow();

},1000);

}

/* FLOW */
function startFlow(){

document.getElementById("section1").classList.add("show");

setTimeout(()=>{
document.getElementById("section2").classList.add("show");

const vid=document.getElementById("video");
vid.play().catch(()=>{});

setTimeout(()=>{
document.getElementById("section3").classList.add("show");
},2000);

},1500);

}

/* GIFT */
function revealGift(){
document.getElementById("gift").style.display="block";
}

/* HEARTS */
setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),9000);
},500);

</script>

</body>
</html>
