<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* ===== CINEMATIC VIDEO FIX ===== */

#bgVideo{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.7);
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* ===== LANDING ===== */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

#landing h1{
font-family:'Dancing Script';
font-size:60px;
min-height:70px;
margin-bottom:20px;
}

#landing p{
font-size:18px;
opacity:0.9;
max-width:600px;
min-height:80px;
text-align:center;
}

/* ===== CENTER INTRO TEXT (FIXED) ===== */

.center-text{
text-align:center !important;
}

/* ===== MAIN ===== */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* ===== GLASS ===== */

.glass{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;

/* hidden until revealed */
opacity:0;
transform:translateY(40px) scale(0.98);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
}

/* ===== TEXT ===== */

.title{
font-family:'Dancing Script';
font-size:32px;
text-align:center;
margin-bottom:25px;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:200px;
}

/* ===== MEDIA (HIDDEN UNTIL TRIGGERED) ===== */

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:20px;
opacity:0;
transform:scale(1.05);
transition:1.2s ease;
}

.photo.show,
.video.show{
opacity:1;
transform:scale(1);
}

/* ===== BUTTON ===== */

button{
margin-top:25px;
padding:15px 50px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
}

/* ===== POPUP ===== */

#popup{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.85);
opacity:0;
pointer-events:none;
transition:1s ease;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-card{
background:rgba(255,255,255,0.1);
padding:40px;
border-radius:20px;
font-family:'Dancing Script';
font-size:22px;
text-align:center;
}

</style>

</head>

<body>

<!-- CINEMATIC BACKGROUND VIDEO -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- POPUP -->
<div id="popup">
<div class="popup-card">Please close your eyes 🙈💗</div>
</div>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>

<p id="landingText"></p>

<button onclick="startMovie()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass" id="scene1">

<p id="introLine" class="center-text"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="scene2">

<h1 class="title" id="videoTitle"></h1>

<video muted loop playsinline class="video" id="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="scene3">

<h1 class="title">Your Gift</h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;"></p>

</div>

</section>

<script>

/* ===== TYPE ENGINE ===== */

function typeText(id,text,speed=110){

return new Promise(resolve=>{

const el=document.getElementById(id);
el.innerHTML="";

let i=0;

function run(){

if(i<text.length){
el.innerHTML+=text.charAt(i++);
setTimeout(run,speed);
}else resolve();

}

run();

});

}

/* ===== YOUR ORIGINAL TEXT (UNCHANGED) ===== */

const landingTitle="Made with love, specially for you — Luyanda 💗";

const landingText=`I made something for you…

because you matter more than I ever say out loud.

Take your time… and open it when you’re ready 💗`;

const introLine="I wanted to be the first to celebrate you… before anyone else gets the chance.";

const mainTitle="Happy Birthday🩵my Luyanda🎈";

const mainText=`Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you as much as you have one for me… even with time and distance, that never really changed.

And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before.

I don’t want to dwell on it today, but I do regret how I handled things, and I’m grateful you gave me another chance to be in your life again and we found our way back to talking again. I know I'm the last person to be talking about promises but I promise to never fumble the chance you gave us. Hurting you again is something I don't wanna see happening.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable.

Enjoy your day. I Love You🩵`;

const videoTitle="It's Your Turn Ke Mfazi";

const giftText=`I got you a small gift

I chose it because it represents time…

I hope you wear it often.

Not just as something pretty, but as a reminder that you are loved 🥹`;

/* ===== LANDING ===== */

window.onload=()=>{

typeText("landingTitle",landingTitle,110);
typeText("landingText",landingText,110);

};

/* ===== MOVIE FLOW (FIXED ORDER) ===== */

async function startMovie(){

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

/* SCENE ORDER LOCKED */

await typeText("introLine",introLine,110);
await typeText("mainTitle",mainTitle,110);
await typeText("message",mainText,110);

/* IMAGE ONLY AFTER MESSAGE */
document.getElementById("photo").classList.add("show");

/* VIDEO ONLY AFTER IMAGE */
await new Promise(r=>setTimeout(r,1200));

await typeText("videoTitle",videoTitle,110);
document.getElementById("video").classList.add("show");

}

/* ===== GIFT ===== */

function revealGift(){

const g=document.getElementById("gift");
g.style.display="block";

typeText("gift",giftText,110).then(()=>{

setTimeout(()=>{

document.getElementById("popup").classList.add("show");

},1200);

});

}

</script>

</body>
</html>
