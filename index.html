<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

  .intro-line{
text-align:center;
opacity:0;
transform:translateY(20px);
margin-bottom:10px;
font-size:16px;
letter-spacing:0.3px;
animation:fadeInIntro 2.5s ease forwards;
animation-delay:0.6s;
}

@keyframes fadeInIntro{
to{
opacity:0.85;
transform:translateY(0);
}
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* LANDING */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

#landing h1{
font-family:'Dancing Script';
font-size:60px;
margin-bottom:20px;
}

#landing p{
font-size:20px;
opacity:0.85;
max-width:600px;
min-height:80px;
}

button{
margin-top:30px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

/* MAIN */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* GLASS (MORE TRANSPARENT) */

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(22px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 50px rgba(0,0,0,0.5);
}

/* TITLE */

.title{
font-family:'Dancing Script';
font-size:30px;
text-align:center;
margin-bottom:25px;
}

/* MESSAGE */

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:250px;
}

/* PHOTO */

.photo{
width:100%;
border-radius:18px;
margin-top:25px;
}

/* VIDEO */

.video{
width:100%;
border-radius:18px;
margin-top:25px;
}

/* GIFT BUTTON */

.gift-btn{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:rgba(255,255,255,0.15);
color:white;
cursor:pointer;
transition:0.3s;
}

.gift-btn:hover{
transform:scale(1.05);
}

/* HEARTS */

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop id="bgVideo" playsinline>
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- LANDING -->
<section id="landing">

<h1>Made with love, specially for you — Luyanda 💗</h1>

<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass">
<p class="intro-line">

I wanted to be the first to celebrate you… before anyone else gets the chance, so you’re seeing this a little earlier.

</p>

<h1 class="title">Happy Birthday🩵my Luyanda🎈</h1>


<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo">

</div>

<div class="glass">

<h1 class="title">A Moment of You</h1>

<video autoplay muted loop playsinline class="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass">

<h1 class="title">Your Gift</h1>

<button class="gift-btn" onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;"></p>

</div>

</section>

<script>

/* LANDING TYPING */

const landingText =
`I made something small for you…

because you matter more than I ever say out loud.

Take your time… and open it when you’re ready 💗`;

let l=0;

function typeLanding(){

if(l < landingText.length){

document.getElementById("landingText").innerHTML += landingText.charAt(l);

l++;

setTimeout(typeLanding,70);

}

}

typeLanding();

/* ENTER SITE */

function enterSite(){

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

typeMessage();

}

/* MAIN MESSAGE */

const text = `Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you as much as you have one for me… even with time and distance, that never really changed.

And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before.

I don’t want to dwell on it today, but I do regret how I handled things, and I’m grateful you gave me another chance to be in your life again and we found our way back to talking again. I know I'm the last person to be talking about promises but I promise to never fumble the chance you gave us. Hurting you again is something I don't wanna see happening.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable.

Enjoy your day. I Love You🩵`;

let i=0;

function typeMessage(){

if(i < text.length){

document.getElementById("message").innerHTML += text.charAt(i);

i++;

setTimeout(typeMessage,100);

}

}

/* GIFT MESSAGE */

const giftText = `I got you a small gift

I chose it because it represents time… and how some things don’t really disappear, they just pause and continue in different ways.

Every moment is something I wanted you to feel held in, even when I’m not there. Not rushed, not forgotten, not replaced… just gently remembered in the way that stays.

I hope you wear it often. Not just as something pretty, but as a reminder that you are valued, remembered, loved and genuinely appreciated.

I hope it will never leave your wrist, just like how you never really left my heart 🥹`;

function revealGift(){

const g=document.getElementById("gift");
g.style.display="block";

let j=0;

function typeGift(){

if(j < giftText.length){

g.innerHTML += giftText.charAt(j);

j++;

setTimeout(typeGift,60);

}

}

typeGift();

}

/* HEARTS */

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),9000);

},500);


</script>

</body>
</html>
