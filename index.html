<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

/* =======================
BASE
======================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* =======================
BACKGROUND
======================= */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* =======================
LANDING
======================= */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
gap:14px;
transition:1s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

#landingTitle{
font-family:'Dancing Script';
font-size:42px;
line-height:1.2;
margin:0;
text-align:center;
}

#landingText{
max-width:520px;
line-height:1.6;
font-size:15px;
opacity:0.92;
white-space:pre-line;
margin:0;
text-align:center;
}

#landing button{
margin-top:10px;
padding:14px 50px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:16px;
cursor:pointer;
transition:0.4s;
font-weight:600;
}

#landing button:hover{
transform:scale(1.07);
}

/* =======================
MAIN
======================= */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 60px rgba(0,0,0,0.6);

opacity:0;
transform:translateY(40px) scale(0.95);
filter:blur(10px);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

.title{
font-family:'Dancing Script';
font-size:34px;
text-align:center;
margin-bottom:25px;
}

#introLine{
text-align:center;
margin-bottom:20px;
line-height:1.9;
opacity:0.9;
white-space:pre-line;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
}

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;

opacity:0;
transform:scale(1.05);
filter:blur(10px);
transition:1.2s ease;
}

.photo.show,
.video.show{
opacity:1;
transform:scale(1);
filter:blur(0);
}

/* =======================
BUTTONS
======================= */

button{
margin-top:10px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
font-weight:600;
}

button:hover{
transform:scale(1.08);
}

/* =======================
POPUP
======================= */

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.88);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:40px 50px;
border-radius:25px;
font-family:'Dancing Script';
font-size:32px;
text-align:center;
line-height:1.5;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

/* =======================
HEARTS
======================= */

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
pointer-events:none;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:0.4;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

/* =======================
RESPONSIVE
======================= */

@media(max-width:768px){

#landingTitle{
font-size:34px;
}

#landingText{
font-size:14px;
max-width:95%;
}

.glass{
padding:35px 25px;
}

.title{
font-size:30px;
}

.message{
font-size:16px;
}

.popup-box{
font-size:26px;
padding:30px;
}

}

</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- POPUP -->
<div id="popup">
<div class="popup-box">
Oh Look who's here🥹<br>
I guess you missed hearing some sweet words from me, that's why you're here ❤️
</div>
</div>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>

<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass" id="section1">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="section2">

<h1 class="title" id="videoTitle"></h1>

<video muted playsinline loop id="video" class="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="section3">

<h1 class="title" id="giftTitle"></h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none; margin-top:25px;"></p>

</div>

</section>

<script>

/* =======================
POST-BIRTHDAY MESSAGES
======================= */

const landingTitle =
"Made with love… just for you, my Luyanda 💗";

const landingText =
"I made this for you because you deserve to feel loved, appreciated, and special in every possible way. 💗\n\n" +

"I know I wasn’t there for the past two birthdays,\n" +
"but having the chance to celebrate this one with you meant more to me than you probably realize.\n\n" +

"So even after the birthday celebrations are over…\n" +
"I still wanted you to have something you can come back to and smile at whenever you need to. 🩵";

const introLine =
"I wanted this to remain something personal, meaningful, and unforgettable… because celebrating you will always matter to me.";

const mainTitle =
"To My Luyanda 🩵";

const mainText =
"Your birthday may have passed… but the way I feel about you hasn’t changed for a second. 🩵\n\n" +

"I still hope your day was filled with love, laughter, peace, and all the little things that made your heart feel light and happy.\n\n" +

"You deserve happiness that goes beyond just one special day.\n\n" +

"I’ve always had a soft spot for you… just as much as you’ve always had one for me.\n\n" +

"No matter the time, distance, or everything that happened in between, that feeling never truly disappeared.\n\n" +

"Being able to talk to you again is something I genuinely appreciate more than I say out loud.\n\n" +

"And I’ll always be grateful that somehow we found our way back to each other.\n\n" +

"I know I might not be perfect, but one thing I mean with all my heart is this: I never want to hurt you again or take your love for granted.\n\n" +

"I just want you to continue feeling loved, appreciated, protected, and cared for… not only on your birthday, but every day after it too.\n\n" +

"And even long after all the birthday wishes fade away… I hope you never forget how special you are to me.\n\n" +

"I love you 🩵";

const videoTitle =
"A Little Something For You 🩵";

const giftTitle =
"Your Gift 🎁";

const giftText =
"I got you something small…\n\n" +

"but it means so much more than it probably looks like. 🥹\n\n" +

"I wanted to give you something you could keep close to you… something simple, but constant.\n\n" +

"Something that quietly becomes part of your everyday life… and maybe reminds you, even in silence, that there’s someone thinking about you.\n\n" +

"Not in a loud or overwhelming way… just something soft, steady, and real.\n\n" +

"And every time you notice it on your wrist, I hope it brings you a little warmth… a quiet reminder that you are cared for, appreciated, valued, and deeply close to someone’s heart.\n\n" +

"It’s honestly just something I felt was right for you.\n\n" +

"I can’t wait to see how beautiful it looks on that cute hand of yours… 🥺\n\n" +

"And I hope it stays with you for a very long time… the same way you’ve stayed close to my heart. 🩵";

/* =======================
LOAD CONTENT
======================= */

window.onload = function(){

document.getElementById("landingTitle").innerText = landingTitle;
document.getElementById("landingText").innerText = landingText;

};

/* =======================
ENTER SITE
======================= */

function enterSite(){

document.getElementById("landing").classList.add("hide");

setTimeout(()=>{

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");

music.volume=0.6;

music.play().catch(()=>{});

startFlow();

},1000);

}

/* =======================
SHOW CONTENT FLOW
======================= */

function startFlow(){

document.getElementById("section1").classList.add("show");

document.getElementById("introLine").innerText = introLine;
document.getElementById("mainTitle").innerText = mainTitle;
document.getElementById("message").innerText = mainText;

setTimeout(()=>{

document.getElementById("photo").classList.add("show");

setTimeout(()=>{

document.getElementById("section2").classList.add("show");

document.getElementById("videoTitle").innerText = videoTitle;

const vid=document.getElementById("video");

vid.classList.add("show");
vid.muted=true;
vid.loop=true;

vid.play().catch(()=>{});

setTimeout(()=>{

document.getElementById("section3").classList.add("show");

document.getElementById("giftTitle").innerText = giftTitle;

},2000);

},2000);

},1200);

}

/* =======================
REVEAL GIFT
======================= */

function revealGift(){

const gift=document.getElementById("gift");

gift.style.display="block";

gift.innerText = giftText;

setTimeout(()=>{

const popup=document.getElementById("popup");

popup.classList.add("show");

if(navigator.vibrate){

navigator.vibrate([200,100,200,100,500]);

}

setTimeout(()=>{

popup.classList.remove("show");

},10000);

},2000);

}

/* =======================
FLOATING HEARTS
======================= */

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},9000);

},500);

</script>

</body>
</html>
