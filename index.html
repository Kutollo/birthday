<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

/* (UNCHANGED STYLES - SAME AS YOUR ORIGINAL) */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
transition:1s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 60px rgba(0,0,0,0.6);

opacity:0;
transform:translateY(40px) scale(0.95);
filter:blur(10px);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

.title{
font-family:'Dancing Script';
font-size:30px;
text-align:center;
margin-bottom:25px;
}

#introLine{
text-align:center;
margin-bottom:20px;
line-height:1.9;
opacity:0.9;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:250px;
}

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;

opacity:0;
transform:scale(1.05);
filter:blur(10px);
transition:1.2s ease;
}

.photo.show,
.video.show{
opacity:1;
transform:scale(1);
filter:blur(0);
}

button{
margin-top:30px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.88);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:40px 50px;
border-radius:25px;
font-family:'Dancing Script';
font-size:32px;
text-align:center;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<div id="popup">
<div class="popup-box">
Please close your eyes 🙈 ❤️
</div>
</div>

<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<section id="main">

<div class="glass" id="section1">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="section2">

<h1 class="title" id="videoTitle"></h1>

<video muted playsinline loop id="video" class="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="section3">

<h1 class="title" id="giftTitle"></h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;"></p>

</div>

</section>

<script>

/* TYPE SYSTEM (UNCHANGED) */
function typeText(id,text,speed=110,callback){

let i=0;
const el=document.getElementById(id);
el.innerHTML="";

function typing(){

if(i<text.length){
el.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,speed);
}else{
if(callback)callback();
}

}

typing();
}

/* =======================
   💗 UPDATED MESSAGES ONLY
======================= */

const landingTitle =
"Made with love… just for you, my Luyanda 💗";

const landingText =
"I made this to celebrate you on your birthday…\n\nbecause you deserve to feel loved, appreciated, and special in every way.\n\nI know I wasn’t there for the past two birthdays,\nbut I’m here now… and I want to make up for every moment I missed.\n\nSo take your time going through this…\nit was all made with you in mind 💗";

const introLine =
"I wanted to be the first to celebrate you… before anyone else gets the chance, so you’re seeing this a little earlier.";

const mainTitle =
"Happy Birthday 🩵 my Luyanda 🎈";

const mainText =
"Tomorrow is going to be special… because it’s the day someone truly important came into this world. 🩵\n\n" +
"I hope your birthday is filled with love, laughter, peace, and all the little things that make your heart feel light and happy. You deserve a day that feels as beautiful as the person you are.\n\n" +
"I’ve always had a soft spot for you… just as much as you’ve always had one for me. No matter the time, distance, or everything that happened in between, that feeling never really disappeared.\n\n" +
"Being able to talk to you again is honestly something I appreciate more than I probably say out loud.\n\n" +
"And I also want to apologize for how things ended between us before. I don’t want to ruin such a beautiful moment by dwelling on the past, but I truly regret the way I handled things.\n\n" +
"I’m grateful you gave me another chance to be part of your life again, and that somehow we found our way back to each other.\n\n" +
"I know I might be the last person who should be speaking about promises… but I mean this with all my heart: I will never take the chance you gave us for granted. Hurting you again is something I never want to happen.\n\n" +
"More than anything, I just want your birthday to feel warm, unforgettable, and full of love. Enjoy every second of it… because you deserve nothing less.\n\n" +
"I love you 🩵";

const videoTitle =
"It’s Your Turn Ke Mfazi";

const giftTitle =
"Your Gift";

const giftText =
"I got you something small…\n\n" +
"but it means more than it looks like it does.\n\n" +
"I wanted you to have something that stays with you… something simple, but constant.\n\n" +
"Something that becomes part of your everyday life in a quiet way… and maybe reminds you that you are thought of, even in the moments when nothing is being said.\n\n" +
"Not in a loud or heavy way… just something soft and steady.\n\n" +
"And every time you notice it, I hope it brings you a little warmth… like a quiet reminder that you are cared for, valued, and close to someone’s heart.\n\n" +
"It’s really just something I wanted to give you… because it felt right for you 🥹 I hope it never leaves your wrist just like how you never left my Heart";

/* (REST OF YOUR CODE UNCHANGED) */

window.onload=function(){

typeText("landingTitle",landingTitle,110,()=>{
setTimeout(()=>typeText("landingText",landingText,110),800);
});

};

function enterSite(){

document.getElementById("landing").classList.add("hide");

setTimeout(()=>{

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

startFlow();

},1000);

}

function startFlow(){

document.getElementById("section1").classList.add("show");

typeText("introLine",introLine,110,()=>{
typeText("mainTitle",mainTitle,110,()=>{
typeText("message",mainText,110,()=>{
document.getElementById("photo").classList.add("show");

setTimeout(()=>{

document.getElementById("section2").classList.add("show");

const vid=document.getElementById("video");
vid.classList.add("show");
vid.muted=true;
vid.playsInline=true;
vid.loop=true;
vid.play().catch(()=>{});

setTimeout(()=>{

document.getElementById("section3").classList.add("show");

typeText("videoTitle",videoTitle,110);

},2000);

},2000);

});
});
});

}

function revealGift(){

const g=document.getElementById("gift");
g.style.display="block";

typeText("gift",giftText,110,()=>{
setTimeout(()=>{

const popup=document.getElementById("popup");
popup.classList.add("show");

if(navigator.vibrate){
navigator.vibrate([200,100,200,100,500]);
}

setTimeout(()=>{
popup.classList.remove("show");
},10000);

},3000);

});

}

setInterval(()=>{

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),9000);

},500);

</script>

</body>
</html>
