<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND VIDEO */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* LANDING */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
transition:1s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

/* MAIN */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* GLASS */

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 60px rgba(0,0,0,0.6);

opacity:0;
transform:translateY(40px) scale(0.95);
filter:blur(10px);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

/* TITLE */

.title{
font-family:'Dancing Script';
font-size:30px;
text-align:center;
margin-bottom:25px;
}

/* INTRO */

#introLine{
text-align:center;
margin-bottom:20px;
line-height:1.9;
opacity:0.9;
}

/* MESSAGE (NO SCROLLING ANYMORE) */

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:200px;
}

/* MEDIA */

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;

opacity:0;
transform:scale(1.05);
filter:blur(10px);
transition:1.2s ease;
}

.photo.show,
.video.show{
opacity:1;
transform:scale(1);
filter:blur(0);
}

/* BUTTON */

button{
margin-top:30px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

/* POPUP */

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.88);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:40px 50px;
border-radius:25px;
text-align:center;
font-family:'Dancing Script';
font-size:32px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

/* HEARTS */

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

</style>

</head>

<body>

<!-- BACKGROUND VIDEO -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- POPUP -->
<div id="popup">
<div class="popup-box">
Please close your eyes 🙈 ❤️
</div>
</div>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass" id="section1">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="section2">

<h1 class="title" id="videoTitle"></h1>

<video muted loop playsinline class="video" id="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="section3">

<h1 class="title" id="giftTitle"></h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;"></p>

</div>

</section>

<script>

/* FORCE BACKGROUND VIDEO */
window.addEventListener("load",()=>{

const bg=document.getElementById("bgVideo");

bg.play().catch(()=>{

document.body.addEventListener("click",()=>{
bg.play();
},{once:true});

});

});

/* TYPE FUNCTION (NO SCROLLING) */

function typeText(id,text,speed=110,callback){

let i=0;
const el=document.getElementById(id);
el.innerHTML="";

function typing(){

if(i<text.length){

el.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,speed);

}else{

if(callback)callback();

}

}

typing();
}

/* TEXT */

const landingTitle="Made with love, specially for you — Luyanda 💗";

const landingText=`I made something for you…

because you matter more than I ever say out loud.

Take your time… and open it when you’re ready 💗`;

const introLine="I wanted to be the first to celebrate you… before anyone else gets the chance, so you’re seeing this a little earlier.";

const mainTitle="Happy Birthday🩵my Luyanda🎈";

const mainText=`Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you as much as you have one for me… even with time and distance, that never really changed.

And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before.

I don’t want to dwell on it today, but I do regret how I handled things, and I’m grateful you gave me another chance to be in your life again and we found our way back to talking again. I know I'm the last person to be talking about promises but I promise to never fumble the chance you gave us. Hurting you again is something I don't wanna see happening.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable.

Enjoy your day. I Love You🩵`;

const videoTitle="It's Your Turn Ke Mfazi";

const giftTitle="Your Gift";

const giftText=`I got you a small gift

I chose it because it represents time… and how some things don’t really disappear, they just pause and continue in different ways.

Every moment is something I wanted you to feel held in, even when I’m not there. Not rushed, not forgotten, not replaced… just gently remembered in the way that stays.

I hope you wear it often. Not just as something pretty, but as a reminder that you are valued, remembered, loved and genuinely appreciated.

I hope it will never leave your wrist, just like how you never really left my heart 🥹`;

/* LANDING */

window.onload=function(){

typeText("landingTitle",landingTitle,110,()=>{

setTimeout(()=>typeText("landingText",landingText,110),800);

});

};

/* ENTER SITE */

function enterSite(){

document.getElementById("landing").classList.add("hide");

setTimeout(()=>{

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

startFlow();

},1000);

}

/* FLOW */

function startFlow(){

document.getElementById("section1").classList.add("show");

typeText("introLine",introLine,110,()=>{

typeText("mainTitle",mainTitle,110,()=>{

typeText("message",mainText,110,()=>{

document.getElementById("photo").classList.add("show");

setTimeout(()=>{

document.getElementById("section2").classList.add("show");

const vid=document.getElementById("video");

vid.classList.add("show");
vid.muted=true;
vid.playsInline=true;
vid.loop=true;

vid.play().catch(()=>{

document.body.addEventListener("click",()=>vid.play(),{once:true});

});

},800);

setTimeout(()=>{

document.getElementById("section3").classList.add("show");

typeText("giftTitle",giftTitle,110);

},1600);

});

});

});

}

/* GIFT */

function revealGift(){

const g=document.getElementById("gift");

g.style.display="block";

typeText("gift",giftText,110,()=>{

setTimeout(()=>{

const popup=document.getElementById("popup");
popup.classList.add("show");

if(navigator.vibrate){
navigator.vibrate([200,100,200,100,500]);
}

setTimeout(()=>{
popup.classList.remove("show");
},10000);

},3000);

});

}

/* HEARTS */

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),9000);

},500);

</script>

</body>
</html>
