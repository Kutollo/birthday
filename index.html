<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* ===== BACKGROUND VIDEO ===== */
#bgVideo{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.6);
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* ===== HEARTS ===== */
.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

/* ===== SECTIONS ===== */
section{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:60px 20px;
opacity:0;
transform:translateY(60px);
transition:1.2s ease;
}

section.show{
opacity:1;
transform:translateY(0);
}

/* ===== GLASS ===== */
.glass{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(25px);
border-radius:25px;
padding:45px;
border:1px solid rgba(255,255,255,0.15);
max-width:850px;
}

/* ===== TEXT ===== */
h1{
font-family:'Dancing Script';
font-size:42px;
text-align:center;
margin-bottom:20px;
}

p{
white-space:pre-line;
text-align:center;
line-height:1.9;
opacity:0.9;
max-width:750px;
}

/* ===== PHOTO ===== */
img{
width:100%;
border-radius:20px;
margin-top:20px;
opacity:0;
transform:scale(1.05);
transition:1s;
}

img.show{
opacity:1;
transform:scale(1);
}

/* ===== BUTTON ===== */
button{
margin-top:25px;
padding:14px 40px;
border-radius:40px;
border:none;
background:white;
color:black;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

/* ===== POPUP ===== */
#popup{
position:fixed;
inset:0;
background:rgba(0,0,0,0.88);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
z-index:999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
padding:40px;
border-radius:25px;
font-family:'Dancing Script';
font-size:30px;
text-align:center;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3">
</audio>

<!-- POPUP -->
<div id="popup">
<div class="popup-box">Please close your eyes 🙈 ❤️</div>
</div>

<!-- ===== LANDING ===== -->
<section id="landing" class="show">
<div class="glass">
<h1 id="landingTitle"></h1>
<p id="landingText"></p>
<button onclick="enterSite()">Open</button>
</div>
</section>

<!-- ===== MAIN ===== -->
<section id="section1">
<div class="glass">
<p id="introLine"></p>
<h1 id="mainTitle"></h1>
<p id="message"></p>
<img src="IMG_2034.jpeg" id="photo">
</div>
</section>

<section id="section2">
<div class="glass">
<h1 id="videoTitle"></h1>
<video id="video" width="100%" loop playsinline muted>
<source src="luyanda.mp4">
</video>
</div>
</section>

<section id="section3">
<div class="glass">
<h1 id="giftTitle"></h1>
<button onclick="revealGift()">Reveal Gift Message</button>
<p id="gift" style="display:none;"></p>
</div>
</section>

<script>

/* ===== TYPE SYSTEM ===== */
function type(id,text,speed=40,cb){
let el=document.getElementById(id);
let i=0;
el.innerHTML="";

function run(){
if(i<text.length){
el.innerHTML+=text[i++];
setTimeout(run,speed);
}else if(cb) cb();
}
run();
}

/* ===== EXACT ORIGINAL MESSAGES (UNCHANGED) ===== */

const landingTitle =
"Made with love… just for you, my Luyanda 💗";

const landingText =
"I made this to celebrate you on your birthday…\n\nbecause you deserve to feel loved, appreciated, and special in every way.\n\nI know I wasn’t there for the past two birthdays,\nbut I’m here now… and I want to make up for every moment I missed.\n\nSo take your time going through this…\nit was all made with you in mind 💗";

const introLine =
"I wanted to be the first to celebrate you… before anyone else gets the chance, so you’re seeing this a little earlier.";

const mainTitle =
"Happy Birthday 🩵 my Luyanda 🎈";

const mainText =
"Tomorrow is going to be special… because it’s the day someone truly important came into this world. 🩵\n\n" +
"I hope your birthday is filled with love, laughter, peace, and all the little things that make your heart feel light and happy. You deserve a day that feels as beautiful as the person you are.\n\n" +
"I’ve always had a soft spot for you… just as much as you’ve always had one for me. No matter the time, distance, or everything that happened in between, that feeling never really disappeared.\n\n" +
"Being able to talk to you again is honestly something I appreciate more than I probably say out loud.\n\n" +
"And I also want to apologize for how things ended between us before. I don’t want to ruin such a beautiful moment by dwelling on the past, but I truly regret the way I handled things.\n\n" +
"I’m grateful you gave me another chance to be part of your life again, and that somehow we found our way back to each other.\n\n" +
"I know I might be the last person who should be speaking about promises… but I mean this with all my heart: I will never take the chance you gave us for granted. Hurting you again is something I never want to happen.\n\n" +
"More than anything, I just want your birthday to feel warm, unforgettable, and full of love. Enjoy every second of it… because you deserve nothing less.\n\n" +
"I love you 🩵";

const videoTitle =
"It’s Your Turn Ke Mfazi";

const giftTitle =
"Your Gift";

const giftText =
"I got you something small…\n\n" +
"but it means so much more than it probably looks like. 🥹\n\n" +
"I wanted to give you something you could keep close to you… something simple, but constant.\n\n" +
"Something that quietly becomes part of your everyday life… and maybe reminds you, even in silence, that there’s someone thinking about you.\n\n" +
"Not in a loud or overwhelming way… just something soft, steady, and real.\n\n" +
"And every time you notice it on your wrist, I hope it brings you a little warmth… a quiet reminder that you are cared for, appreciated, valued, and deeply close to someone’s heart.\n\n" +
"It’s honestly just something I felt was right for you.\n\n" +
"I can’t wait to see how beautiful it looks on that cute hand of yours… 🥺\n\n" +
"And I hope it never leaves your wrist… the same way you never really left my heart. 🩵";

/* ===== FLOW ===== */

window.onload=function(){

type("landingTitle",landingTitle,90,()=>{
setTimeout(()=>type("landingText",landingText,60),800);
});

};

function enterSite(){

document.getElementById("landing").classList.remove("show");

setTimeout(()=>{

document.getElementById("landing").style.display="none";
document.getElementById("section1").classList.add("show");

document.getElementById("music").volume=0.6;
document.getElementById("music").play().catch(()=>{});

type("introLine",introLine,50,()=>{
type("mainTitle",mainTitle,60,()=>{
type("message",mainText,30,()=>{
document.getElementById("photo").classList.add("show");

setTimeout(()=>{
document.getElementById("section2").classList.add("show");
document.getElementById("video").play().catch(()=>{});
document.getElementById("videoTitle").innerText=videoTitle;

setTimeout(()=>{
document.getElementById("section3").classList.add("show");
document.getElementById("giftTitle").innerText=giftTitle;
},2000);

},2000);

});
});
});

}

function revealGift(){

document.getElementById("gift").style.display="block";

type("gift",giftText,35,()=>{

setTimeout(()=>{
document.getElementById("popup").classList.add("show");

setTimeout(()=>{
document.getElementById("popup").classList.remove("show");
},8000);

},2000);

});

}

setInterval(()=>{

let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*6)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),9000);

},400);

</script>

</body>
</html>
