<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Luyanda 💗</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family: "Poppins", sans-serif;
background-image:url("IMG_2034.jpeg");
background-size:cover;
background-position:center;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
}

.card{
position:relative;
background:rgba(255,255,255,0.9);
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.25);
animation:fadeIn 2s ease;
}

h1{
color:#ff5c8a;
font-size:28px;
}

p{
color:#555;
}

button{
margin-top:20px;
padding:12px 28px;
border:none;
border-radius:30px;
background:#ff5c8a;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

@keyframes fadeIn{
from{opacity:0;transform:scale(1.1)}
to{opacity:1;transform:scale(1)}
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">

<h1>Made Specially For You 💌</h1>
<p>Luyanda • 23 May 2026</p>

<button onclick="enter()">Open</button>

</div>

<script>

function enter(){
window.location.href="main.html";
}

</script>

</body>
</html>
