<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
transition:1s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 60px rgba(0,0,0,0.6);

opacity:0;
transform:translateY(40px) scale(0.95);
filter:blur(10px);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

.title{
font-family:'Dancing Script';
font-size:30px;
text-align:center;
margin-bottom:25px;
}

#introLine{
text-align:center;
margin-bottom:20px;
line-height:1.9;
opacity:0.9;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:250px;
}

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;

opacity:0;
transform:scale(1.05);
filter:blur(10px);
transition:1.2s ease;
}

.photo.show,
.video.show{
opacity:1;
transform:scale(1);
filter:blur(0);
}

button{
margin-top:30px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.88);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:40px 50px;
border-radius:25px;
font-family:'Dancing Script';
font-size:32px;
text-align:center;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<div id="popup">
<div class="popup-box">
Please close your eyes 🙈 ❤️
</div>
</div>

<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<section id="main">

<div class="glass" id="section1">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="section2">

<h1 class="title" id="videoTitle"></h1>

<video muted playsinline loop id="video" class="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass" id="section3">

<h1 class="title" id="giftTitle"></h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;"></p>

</div>

</section>

<script>

/* TYPE SYSTEM */
function typeText(id,text,speed=110,callback){

let i=0;
const el=document.getElementById(id);
el.innerHTML="";

function typing(){

if(i<text.length){
el.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,speed);
}else{
if(callback)callback();
}

}

typing();
}

/* TEXT (CLINGY ROMANTIC VERSION) */

const landingTitle="Made with love… only for you, Luyanda 💗";

const landingText=`I made this for you…

and honestly, I don’t even know how to explain how much space you take up in my heart.

Take your time…
but don’t keep me waiting too long 💗`;

const introLine="I just had to be the first one to reach you today… I couldn’t wait for anyone else.";

const mainTitle="Happy Birthday 🩵 my Luyanda 🎈";

const mainText=`Tomorrow is your day… but to me, it already feels like something I’ve been waiting for.

Because you don’t just exist in my life… you stay in it. Quietly, constantly, in the background of everything I do.

I hope today wraps itself around you softly… love, laughter, peace… all of it finding you without you even trying.

And if I’m being honest… I don’t think you realise how much I still carry you with me.

Even when we weren’t talking… even when there was silence… you were still there. Just in a different way.

And now that we’re talking again… I won’t lie… I like it a little too much. More than I admit out loud.

I’m sorry for the past between us.

I don’t want it to define us… but I do regret it, and I’m really grateful you still let me be part of your life again.

Because I don’t want to lose that again. I don’t want distance between us again. I don’t want that silence again.

I know I’m not perfect with promises… but I’m serious when I say I don’t want to mess this up. Not you. Not us.

More than anything… I just want today to feel beautiful for you. Soft, warm, unforgettable… like it was made just for your heart.

Happy birthday… I love you more than I know how to explain 🩵`;

const videoTitle="It’s your turn… ke mfazi 🩵";

const giftTitle="Your Gift";

const giftText=`I got you something small…

but don’t let “small” fool you… it carries a lot of me in it.

I chose it because it represents time… and how time doesn’t really take people away from us when they matter. It just changes how close they feel.

And you… you never really feel far.

There’s always this quiet pull toward you in me… like no matter what happens, I still find my way back to you emotionally.

Every moment behind this is me thinking of you… hoping you feel held, even when I’m not right there next to you. Not rushed. Not forgotten. Not replaced. Just… close.

I hope you wear it often… not just because it looks nice, but because it reminds you that you are genuinely loved, deeply valued, and constantly thought of.

And I really hope it never leaves your wrist… because I don’t think you ever really leave my heart either 🥹`;

/* LANDING */

window.onload=function(){

typeText("landingTitle",landingTitle,110,()=>{

setTimeout(()=>typeText("landingText",landingText,110),800);

});

};

/* ENTER */

function enterSite(){

document.getElementById("landing").classList.add("hide");

setTimeout(()=>{

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

startFlow();

},1000);

}

/* FLOW */

function startFlow(){

document.getElementById("section1").classList.add("show");

typeText("introLine",introLine,110,()=>{

typeText("mainTitle",mainTitle,110,()=>{

typeText("message",mainText,110,()=>{

document.getElementById("photo").classList.add("show");

/* 2s delay → video */
setTimeout(()=>{

document.getElementById("section2").classList.add("show");

const vid=document.getElementById("video");
vid.classList.add("show");
vid.muted=true;
vid.playsInline=true;
vid.loop=true;
vid.play().catch(()=>{});

/* 2s delay → gift */
setTimeout(()=>{

document.getElementById("section3").classList.add("show");

typeText("videoTitle",videoTitle,110);

},2000);

},2000);

});

});

});

}

/* GIFT */

function revealGift(){

const g=document.getElementById("gift");
g.style.display="block";

typeText("gift",giftText,110,()=>{

setTimeout(()=>{

const popup=document.getElementById("popup");
popup.classList.add("show");

if(navigator.vibrate){
navigator.vibrate([200,100,200,100,500]);
}

setTimeout(()=>{
popup.classList.remove("show");
},10000);

},3000);

});

}

/* HEARTS */

setInterval(()=>{

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),9000);

},500);

</script>

</body>
</html>
