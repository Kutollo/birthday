<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */

#bgVideo{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* LANDING */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

#landing h1{
font-family:'Dancing Script';
font-size:60px;
margin-bottom:20px;
min-height:70px;
}

#landing p{
font-size:18px;
opacity:0.9;
max-width:600px;
min-height:80px;
text-align:center;
}

/* MAIN */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* GLASS */

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(20px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
opacity:0;
transform:translateY(30px);
transition:1s ease;
}

.glass.show{
opacity:1;
transform:translateY(0);
}

/* TEXT */

.title{
font-family:'Dancing Script';
font-size:30px;
text-align:center;
margin-bottom:25px;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:250px;
}

/* MEDIA */

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;
opacity:0;
transition:1s ease;
}

.photo.show,
.video.show{
opacity:1;
}

/* BUTTON */

button{
margin-top:25px;
padding:15px 50px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
}

/* POPUP */

#popup{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.85);
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-card{
background:rgba(255,255,255,0.1);
padding:35px 45px;
border-radius:20px;
font-family:'Dancing Script';
font-size:22px;
text-align:center;
}

/* HEARTS */

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- POPUP -->
<div id="popup">
<div class="popup-card">Please close your eyes 🙈💗</div>
</div>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass">

<h1 class="title" id="videoTitle"></h1>

<video muted loop playsinline class="video" id="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

<div class="glass">

<h1 class="title">Your Gift</h1>

<button onclick="revealGift()">Reveal Gift Message</button>

<p class="message" id="gift" style="display:none;"></p>

</div>

</section>

<script>

/* ===== SAFE TYPE FUNCTION ===== */

function typeText(id,text,speed=110,callback){

const el=document.getElementById(id);
if(!el) return;

let i=0;
el.innerHTML="";

function typing(){

if(i<text.length){
el.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,speed);
}else if(callback){
callback();
}

}

typing();
}

/* ===== TEXT ===== */

const landingTitle="Made with love, specially for you — Luyanda 💗";

const landingText=`I made something for you…

because you matter more than I ever say out loud.

Take your time… and open it when you’re ready 💗`;

const introLine="I wanted to be the first to celebrate you… before anyone else gets the chance.";

const mainTitle="Happy Birthday🩵my Luyanda🎈";

const mainText=`Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you as much as you have one for me…

And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before.

I don’t want to dwell on it today, but I do regret how I handled things.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable.

Enjoy your day. I Love You🩵`;

const giftText=`I got you a small gift

I chose it because it represents time…

I hope you wear it often.

Not just as something pretty, but as a reminder that you are loved 🥹`;

/* ===== FLOW (FIXED CLEAN) ===== */

function enterSite(){

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

/* FLOW START */

typeText("introLine",introLine,110,()=>{

typeText("mainTitle",mainTitle,110,()=>{

typeText("message",mainText,110,()=>{

document.getElementById("photo").classList.add("show");

typeText("videoTitle", "It's Your Turn Ke Mfazi",110,()=>{

document.getElementById("video").classList.add("show");

});

});

});

});

}

/* ===== GIFT + POPUP ===== */

function revealGift(){

const g=document.getElementById("gift");
g.style.display="block";

typeText("gift",giftText,110,()=>{

setTimeout(()=>{

document.getElementById("popup").classList.add("show");

},1200);

});

}

/* ===== HEARTS ===== */

setInterval(()=>{

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*6)+"s";
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),9000);

},500);

</script>

</body>
</html>
