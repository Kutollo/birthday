<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
#bgVideo{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* LANDING */
#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

#landing h1{
font-family:'Dancing Script';
font-size:55px;
margin-bottom:20px;
min-height:70px;
}

#landing p{
font-size:18px;
max-width:600px;
min-height:80px;
opacity:0.9;
}

button{
margin-top:25px;
padding:15px 50px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
}

/* MAIN */
#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* GLASS */
.glass{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(20px);
border-radius:25px;
padding:50px;
margin-bottom:40px;

opacity:0;
transform:translateY(30px);
transition:1s ease;
}

.glass.show{
opacity:1;
transform:translateY(0);
}

/* TEXT */
.title{
font-family:'Dancing Script';
font-size:32px;
text-align:center;
margin-bottom:25px;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:200px;
}

/* MEDIA */
.photo,
.video{
width:100%;
border-radius:18px;
margin-top:20px;
opacity:0;
transition:1s ease;
}

.photo.show,
.video.show{
opacity:1;
}

/* POPUP */
#popup{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.85);
opacity:0;
pointer-events:none;
transition:1s ease;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-card{
background:rgba(255,255,255,0.1);
padding:40px;
border-radius:20px;
font-family:'Dancing Script';
font-size:22px;
text-align:center;
}

</style>

</head>

<body>

<!-- BACKGROUND VIDEO -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- AUDIO -->
<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<!-- POPUP -->
<div id="popup">
<div class="popup-card">Please close your eyes 🙈💗</div>
</div>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="startMovie()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass">

<p id="introLine"></p>

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass">

<h1 class="title" id="videoTitle"></h1>

<video muted loop playsinline class="video" id="video">
<source src="luyanda.mp4" type="video/mp4">
</video>

</div>

</section>

<script>

/* SAFE TYPEWRITER */
function typeText(id,text,speed=110,cb){

const el=document.getElementById(id);
if(!el) return;

el.innerHTML="";
let i=0;

function run(){

if(i<text.length){
el.innerHTML+=text.charAt(i++);
setTimeout(run,speed);
}else if(cb){
cb();
}

}

run();
}

/* TEXT (UNCHANGED) */
const landingTitle="Made with love, specially for you — Luyanda 💗";

const landingText=`I made something for you…

because you matter more than I ever say out loud.

Take your time… and open it when you’re ready 💗`;

const introLine="I wanted to be the first to celebrate you… before anyone else gets the chance.";

const mainTitle="Happy Birthday🩵my Luyanda🎈";

const mainText=`Tomorrow will be important, because it’s the day someone really special came into the world.

I hope you’re surrounded by love, laughter, and everything that makes your heart feel light.

I’ve always had a soft spot for you as much as you have one for me… even with time and distance, that never really changed.

And being able to talk again now feels like something I quietly appreciate more than I say out loud.

I also want to say I’m sorry for how things went between us before.

I don’t want to dwell on it today, but I do regret how I handled things.

More than anything, I just want you to have a birthday that feels warm, special, and unforgettable.

Enjoy your day. I Love You🩵`;

const videoTitle="It's Your Turn Ke Mfazi";

function startMovie(){

document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

/* STRICT ORDER FLOW */
typeText("introLine",introLine,110,()=>{

typeText("mainTitle",mainTitle,110,()=>{

typeText("message",mainText,110,()=>{

document.getElementById("photo").classList.add("show");

setTimeout(()=>{

typeText("videoTitle",videoTitle,110,()=>{

document.getElementById("video").classList.add("show");

setTimeout(()=>{

document.getElementById("popup").classList.add("show");

},1200);

});

},1000);

});

});

});

}

</script>

</body>
</html>
