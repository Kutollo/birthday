<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Luyanda ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<!-- PDF LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>

/* ================= BASE ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* ================= LANDING ================= */

#landing{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
transition:1s ease;
}

#landing.hide{
opacity:0;
transform:scale(1.1);
filter:blur(10px);
}

/* ================= MAIN ================= */

#main{
display:none;
max-width:900px;
margin:auto;
padding:60px 20px;
}

/* ================= CARDS ================= */

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:25px;
padding:50px;
margin-bottom:40px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 10px 60px rgba(0,0,0,0.6);

opacity:0;
transform:translateY(40px) scale(0.95);
filter:blur(10px);
transition:1.2s ease;
}

.glass.show{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

/* ================= TEXT ================= */

.title{
font-family:'Dancing Script';
font-size:30px;
text-align:center;
margin-bottom:25px;
}

.message{
white-space:pre-line;
text-align:justify;
line-height:1.9;
font-size:18px;
min-height:250px;
}

/* DROP CAP EFFECT */

.message::first-letter{
font-size:85px;
font-weight:700;
float:left;
line-height:0.85;
padding-right:12px;
padding-top:8px;
font-family:'Dancing Script',cursive;
color:white;
text-shadow:0 0 20px rgba(255,255,255,0.25);
}

/* ================= MEDIA ================= */

.photo,
.video{
width:100%;
border-radius:18px;
margin-top:25px;

opacity:0;
transform:scale(1.05);
filter:blur(10px);
transition:1.2s ease;
}

.photo.show,
.video.show{
opacity:1;
transform:scale(1);
filter:blur(0);
}

/* ================= BUTTON ================= */

button{
margin-top:30px;
padding:15px 55px;
border-radius:40px;
border:none;
background:white;
color:black;
font-size:18px;
cursor:pointer;
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

/* ================= POPUP ================= */

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.88);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#popup.show{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:40px 50px;
border-radius:25px;
font-family:'Dancing Script';
font-size:32px;
text-align:center;
animation:float 3s ease-in-out infinite;
}

/* ================= HEARTS ================= */

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
opacity:0.4;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

/* ================= PRINT CLEAN ================= */

@media print{
body{background:white;color:black;}
#bgVideo,.overlay,button,#popup,.heart{display:none!important;}
.glass{opacity:1!important;filter:none!important;}
}

</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
<source src="cinematic.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="bg.mp3" type="audio/mp3">
</audio>

<div id="popup">
<div class="popup-box">Please close your eyes 🙈 ❤️</div>
</div>

<!-- LANDING -->
<section id="landing">

<h1 id="landingTitle"></h1>
<p id="landingText"></p>

<button onclick="enterSite()">Open</button>

</section>

<!-- MAIN -->
<section id="main">

<div class="glass" id="section1">

<h1 class="title" id="mainTitle"></h1>

<p class="message" id="message"></p>

<img src="IMG_2034.jpeg" class="photo" id="photo">

</div>

<div class="glass" id="section2">

<h1 class="title" id="videoTitle"></h1>

<video muted playsinline loop id="video" class="video">
<source src="luyanda.mp4">
</video>

</div>

<div class="glass" id="section3">

<h1 class="title">Your Gift</h1>

<p class="message" id="gift"></p>

<button onclick="generateBookPDF()">Download Love Book (PDF)</button>

</div>

</section>

<script>

/* TYPE EFFECT */
function typeText(id,text,speed=110,callback){

let i=0;
const el=document.getElementById(id);
el.innerHTML="";

function typing(){
if(i<text.length){
el.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,speed);
}else if(callback)callback();
}

typing();
}

/* ================= ORIGINAL MESSAGES ================= */

const landingTitle =
"Made with love… just for you, my Luyanda 💗";

const landingText =
"I made this to celebrate you on your birthday…\n\nbecause you deserve to feel loved, appreciated, and special in every way.\n\nI know I wasn’t there for the past two birthdays,\nbut I’m here now… and I want to make up for every moment I missed.\n\nSo take your time going through this…\nit was all made with you in mind 💗";

const mainTitle =
"Happy Birthday 🩵 my Luyanda 🎈";

const mainText =
"Tomorrow is going to be special… because it’s the day someone truly important came into this world. 🩵\n\n" +
"I hope your birthday is filled with love, laughter, peace, and all the little things that make your heart feel light and happy. You deserve a day that feels as beautiful as the person you are.\n\n" +
"I’ve always had a soft spot for you… just as much as you’ve always had one for me. No matter the time, distance, or everything that happened in between, that feeling never really disappeared.\n\n" +
"I’m grateful you gave me another chance.\n\n" +
"I will never take the chance you gave us for granted.\n\n" +
"I love you 🩵";

const videoTitle =
"It’s Your Turn Ke Mfazi";

const giftText =
"I got you something small…\n\nbut it means so much more than it looks like.\n\nI wanted something simple… something that stays with you.\n\nAnd every time you see it, I hope it reminds you that you are loved 🩵";

/* ================= FLOW ================= */

window.onload=function(){

typeText("landingTitle",landingTitle,110,()=>{
setTimeout(()=>typeText("landingText",landingText,110),800);
});

};

function enterSite(){

document.getElementById("landing").classList.add("hide");

setTimeout(()=>{
document.getElementById("landing").style.display="none";
document.getElementById("main").style.display="block";

const music=document.getElementById("music");
music.volume=0.6;
music.play().catch(()=>{});

startFlow();

},1000);

}

function startFlow(){

document.getElementById("section1").classList.add("show");

typeText("mainTitle",mainTitle,110,()=>{
typeText("message",mainText,110,()=>{
document.getElementById("photo").classList.add("show");

setTimeout(()=>{
document.getElementById("section2").classList.add("show");

setTimeout(()=>{
document.getElementById("section3").classList.add("show");
typeText("videoTitle",videoTitle,110);
typeText("gift",giftText,110);
},2000);

},2000);

});
});
}

/* ================= PDF EXPORT ================= */

function generateBookPDF(){

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

let y = 20;

doc.setFont("times","bold");
doc.setFontSize(24);
doc.text("For Luyanda ❤️",105,50,{align:"center"});

doc.setFontSize(14);
doc.text("A love story written just for you",105,70,{align:"center"});

doc.addPage();

function add(text,title){

doc.setFont("times","bold");
doc.setFontSize(16);
doc.text(title,20,y);
y+=10;

doc.setFont("times","normal");
doc.setFontSize(12);

const lines=doc.splitTextToSize(text,170);
doc.text(lines,20,y);
y+=lines.length*6+10;

if(y>260){doc.addPage();y=20;}

}

add(mainText,"Birthday Message 💙");
add(giftText,"Gift Message 🎁");

doc.save("For_Luyanda_Love_Book.pdf");
}

</script>

</body>
</html>
